<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list! – RescueBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:      #006d77;
    --teal-dark: #00353c;
    --saffron:   #ffab69;
    --cream:     #f4faff;
    --muted:     #3e494a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .icon {
    width: 88px; height: 88px;
    background: rgba(0,109,119,0.1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem;
    margin: 0 auto 28px;
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--teal-dark);
    letter-spacing: -1px;
    margin-bottom: 16px;
  }
  p {
    font-size: 1.05rem;
    color: var(--muted);
    line-height: 1.65;
    max-width: 420px;
    margin: 0 auto 36px;
  }
  a.btn {
    display: inline-block;
    background: var(--teal);
    color: white;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 1.5rem;
    font-weight: 600;
    font-size: 0.95rem;
    transition: background 0.2s;
  }
  a.btn:hover { background: var(--teal-dark); }
  .logo {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--teal-dark);
    text-decoration: none;
    display: flex; align-items: center; gap: 6px;
  }
  .dot {
    width: 8px; height: 8px;
    background: var(--saffron);
    border-radius: 50%;
  }
</style>
</head>
<body>
  <a href="/" class="logo">RescueBite<span class="dot"></span></a>
  <div class="icon">🎉</div>
  <h1>You're on the list!</h1>
  <p>We'll reach out the moment RescueBite lands in your city. In the meantime — tell a friend who loves a great deal.</p>
  <a href="/" class="btn">Back to home</a>
</body>
</html>
